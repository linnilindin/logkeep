name: Deploy API

# Builds the API container and updates the Lambda function. Authenticates with
# OIDC, so no long-lived AWS access key is stored in the repository.
#
# One-time AWS setup before this can run:
#   1. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
#   2. Create a role whose trust policy allows this repository to assume it
#   3. Grant that role ecr:* on the repository and lambda:UpdateFunctionCode
#   4. Add the repository variables below
#
# Repository variables: AWS_ROLE_ARN, AWS_REGION, ECR_REPO, FUNCTION_NAME

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The runner is x86, so building the arm64 image Lambda expects needs QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPO }}
        run: |
          IMAGE="$REGISTRY/$REPO:${GITHUB_SHA::7}"
          docker buildx build --platform linux/arm64 -t "$IMAGE" --push .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.FUNCTION_NAME }}" \
            --image-uri "$IMAGE" >/dev/null
          aws lambda wait function-updated-v2 \
            --function-name "${{ vars.FUNCTION_NAME }}"
